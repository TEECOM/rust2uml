[package]
name = "rust2uml"
version = "0.0.2"
description = "A library to generating UML language from Rust's project into graphiz/dot file."
authors = ["adjivas <adjivas@users.noreply.github.com>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
documentation = "https://github.com/silence-coding/ml"
repository = "https://github.com/silence-coding/ml"
homepage = "https://github.com/silence-coding/ml"
keywords = ["uml", "graph", "dot", "generator", "modeling-language"]
categories = ["visualization"]
edition = "2024"

[package.metadata.rust-analyzer]
rustc_private = true


[[example]]
name = "ml"
path = "examples/main.rs"
doc = false
test = false

[lib]
test = false
doctest = true

[features]
default = []
implem = []
fn-emilgardis = []
lints = ["clippy", "nightly"]
nightly = []                  # for building with nightly and unstable features
unstable = []                 # for building with unstable features on stable Rust
debug = []                    # for building with debug messages
travis = ["lints", "nightly"] # for building with travis-cargo

[dependencies]
colored = "3.1.1"
dot = "0.1.4"
once_cell = "1.8.0"
strfmt = "0.2.4"
urlencoding = "2.1.0"

[dependencies.itertools]
version = "0.14.0"

[dependencies.walkdir]
version = "2.5.0"

[dependencies.clippy]
version = "0"
optional = true

[dev-dependencies]
argi = "0.1.0-beta.5"
